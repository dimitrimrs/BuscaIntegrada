<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300..700&display=swap" rel="stylesheet">
  <title>Busca Integrada</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="info-box">
    <h2>BUSCA INTEGRADA</h2><br />
    <p>Bem vindo ao nosso sistema de buscas! <br>Digite o nome do produto na barra de pesquisa e clique no botão
      "Buscar". "Google 2, é você?"
    </p>
  </div>

  <!-- Carrossel -->
  <div class="carousel-container">
    <button class="nav prev" onclick="scrollCarousel(-1)" aria-label="Anterior">&#10094;</button>
    <div id="carousel" class="carousel">
    </div>
    <button class="nav next" onclick="scrollCarousel(1)" aria-label="Próximo">&#10095;</button>
  </div>

  <!-- Barra de pesquisa -->
  <div class="search-box">
    <input type="text" id="search" placeholder="Digite o produto..." />
    <button onclick="buscar()">Buscar</button>
  </div>

  <script src="script.js" defer></script>
</body>

</html>
