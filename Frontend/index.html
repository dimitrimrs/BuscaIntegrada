<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SiteDeBuscaIntegrada</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div class="info-box">
    <p>
      Olá, esse é o <strong>SiteDeBuscaIntegrada</strong>!<br/>
      Para começar, insira algum produto de seu interesse para buscarmos e trazermos as melhores opções para você!
    </p>
  </div>

  <!-- Carrossel -->
  <div class="carousel-container">
    <button class="nav prev" onclick="scrollCarousel(-1)" aria-label="Anterior">&#10094;</button>
    <div id="carousel" class="carousel"></div>
    <button class="nav next" onclick="scrollCarousel(1)" aria-label="Próximo">&#10095;</button>
  </div>

  <!-- Barra de pesquisa -->
  <div class="search-box">
    <input type="text" id="search" placeholder="Digite o produto..." />
    <button onclick="buscar()">Buscar</button>
  </div>

  <script src="script.js" defer></script>
</body>
</html>
